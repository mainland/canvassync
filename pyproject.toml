[project]
name = "canvassync"
description = "Synchronize files with Canvas"
authors = [
    {name = "Geoffrey Mainland", email = "mainland@drexel.edu"},
]
version = "0.1"
requires-python = ">=3.12"
dependencies = [
    "BeautifulSoup4",
    "PyYAML",
    "canvasapi",
    "jinja2",
    "lxml",
    "pandas",
    "pypandoc_binary",
    "python-dateutil",
    "tzlocal",
    "css-inline",
    "rich",
]

[project.optional-dependencies]
dev = [
    "docformatter",
    "mypy",
    "pandas-stubs",
    "pre-commit",
    "ruff",
    "types-PyYAML",
    "types-python-dateutil",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
canvassync = [
    "py.typed",
    "filters/*.lua",
]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
extend-select = [
  "UP",   # pyupgrade
  "E501", # line too long
  "E",    # pycodestyle
  "F",    # Pyflakes
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "I",    # isort
]

[tool.docformatter]
in-place = true
recursive = true
wrap-summaries = 79
wrap-descriptions = 72
close-quotes-on-newline = true

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = [
    "canvasapi.*",
    "pypandoc.*",
    "tzlocal.*",
    "bs4.*",
]
ignore_missing_imports = true

[project.scripts]
canvas-sync = "canvassync.command_line:sync"
